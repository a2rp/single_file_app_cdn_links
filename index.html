<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#07111f">
    <meta name="description" content="A single-file React demo powered by React and Babel CDN links.">
    <meta property="og:title" content="React CDN Single-File Demo">
    <meta property="og:description" content="A small React presentation running from one HTML file and CDN dependencies.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://a2rp.github.io/single_file_app_cdn_links/">
    <meta property="og:image" content="https://a2rp.github.io/single_file_app_cdn_links/preview.png">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" href="./public/favicon.ico">
    <title>React CDN Single-File Demo</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        :root { color-scheme: dark; --bg: #07111f; --surface: #0d1d32; --surface-soft: #102541; --text: #edf5ff; --muted: #9db0c5; --border: #28415f; --accent: #67d6ba; --blue: #79b9ff; }
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { margin: 0; min-width: 320px; color: var(--text); background: var(--bg); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        a { color: inherit; }
        .page { min-height: 100vh; }
        .header { position: fixed; z-index: 5; inset: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 14px max(18px, calc((100% - 1060px) / 2)); border-bottom: 1px solid rgba(148, 163, 184, .16); background: rgba(7, 17, 31, .9); backdrop-filter: blur(16px); }
        .brand { display: inline-flex; align-items: center; gap: 11px; color: var(--text); text-decoration: none; font-weight: 800; }
        .brand img { width: 38px; height: 38px; padding: 5px; border: 1px solid var(--border); border-radius: 11px; background: #0d1d32; object-fit: contain; transition: border-color .18s ease, box-shadow .18s ease; }
        .brand:hover img { border-color: var(--blue); box-shadow: 0 0 18px rgba(121, 185, 255, .2); }
        .brand span { display: grid; gap: 1px; }
        .brand small, .eyebrow { color: var(--blue); font-size: 10px; letter-spacing: .16em; font-weight: 800; }
        .header-note { display: inline-flex; gap: 8px; align-items: center; color: var(--muted); font-size: 12px; }
        .header-note strong { color: var(--accent); }
        .main { width: min(100% - 36px, 960px); margin: 0 auto; padding: 136px 0 80px; }
        .hero { display: grid; grid-template-columns: minmax(0, 1fr) 280px; align-items: end; gap: 30px; }
        .eyebrow { margin: 0 0 14px; }
        h1 { max-width: 620px; margin: 0; font-size: clamp(42px, 7vw, 78px); line-height: .96; letter-spacing: -.06em; }
        .intro { max-width: 600px; margin: 24px 0 0; color: var(--muted); font-size: 16px; line-height: 1.7; }
        .status-card { display: grid; gap: 14px; padding: 20px; border: 1px solid var(--border); border-radius: 18px; background: var(--surface); transition: border-color .18s ease, box-shadow .18s ease; }
        .status-card:hover { border-color: var(--accent); box-shadow: 0 14px 34px rgba(0, 0, 0, .2); }
        .status-icon { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 12px; color: var(--bg); background: var(--accent); font-weight: 900; }
        .status-card strong { font-size: 16px; }
        .status-card span { color: var(--muted); font-size: 12px; line-height: 1.5; }
        .content-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 48px; }
        .card { padding: 24px; border: 1px solid var(--border); border-radius: 18px; background: var(--surface); transition: border-color .18s ease, box-shadow .18s ease; }
        .card:hover { border-color: var(--blue); box-shadow: 0 14px 34px rgba(0, 0, 0, .2); }
        .card.wide { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: center; }
        .card h2 { margin: 0 0 9px; font-size: 21px; letter-spacing: -.025em; }
        .card p { margin: 0; color: var(--muted); line-height: 1.65; }
        .code { padding: 14px 16px; border: 1px solid #38577b; border-radius: 11px; color: var(--accent); background: #081625; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; white-space: nowrap; }
        .footer { display: flex; align-items: center; justify-content: space-between; gap: 20px; width: min(100% - 36px, 960px); margin: 0 auto; padding: 24px 0 34px; border-top: 1px solid var(--border); }
        .footer-copy { display: grid; gap: 7px; color: var(--muted); font-size: 12px; }
        .footer-copy strong, .footer-copy a:hover { color: var(--text); }
        .footer-copy a { font-weight: 700; text-decoration: none; }
        .footer-copy a:hover { color: var(--accent); text-shadow: 0 0 14px rgba(103, 214, 186, .25); }
        .footer-links { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 7px; }
        .footer-links a { display: grid; place-items: center; min-width: 31px; height: 31px; padding: 0 7px; border: 1px solid var(--border); border-radius: 9px; color: var(--muted); font-size: 11px; font-weight: 800; text-decoration: none; transition: border-color .18s ease, color .18s ease, box-shadow .18s ease; }
        .footer-links a:hover { color: var(--text); border-color: var(--accent); box-shadow: 0 0 15px rgba(103, 214, 186, .16); }
        @media (max-width: 700px) { .header-note { display: none; } .hero { grid-template-columns: 1fr; } .status-card { max-width: 360px; } .card.wide { grid-template-columns: 1fr; } }
        @media (max-width: 500px) { .main, .footer { width: min(100% - 28px, 960px); } .main { padding-top: 112px; } .content-grid { grid-template-columns: 1fr; } .card.wide { grid-column: auto; } .footer { align-items: flex-start; flex-direction: column; } .footer-links { justify-content: flex-start; } }
    </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
    const connectLinks = [
        ["Portfolio", "https://www.ashishranjan.net/", "↗"],
        ["GitHub", "https://github.com/a2rp", "GH"],
        ["CodePen", "https://codepen.io/ash1198", "CP"],
        ["LinkedIn", "https://www.linkedin.com/in/aashishranjan", "in"],
        ["Facebook", "https://www.facebook.com/theash.ashish/", "f"],
        ["YouTube", "https://www.youtube.com/@ashishranjan-ashz?sub_confirmation=1", "▶"],
    ];
    const supportLinks = [
        ["Support", "https://a2rp-donation-page.netlify.app/", "♥"],
        ["Buy Me a Coffee", "https://buymeacoffee.com/a2rp", "☕"],
        ["Patreon", "https://patreon.com/a2rp", "P"],
    ];

    function FooterLinks({ links }) {
        return <div className="footer-links">{links.map(([label, href, icon]) => <a key={label} href={href} target="_blank" rel="noopener noreferrer" aria-label={label} title={label}>{icon}</a>)}</div>;
    }

    function FirstApp() {
        return <div className="page">
            <header className="header">
                <a className="brand" href="#top" aria-label="React CDN demo home"><img src="./public/logo.png" alt="" /><span><small>A2RP LAB</small>React CDN Demo</span></a>
                <div className="header-note"><strong>Single file</strong> powered by CDN links</div>
            </header>
            <main className="main" id="top">
                <section className="hero">
                    <div><p className="eyebrow">REACT WITHOUT A BUILD STEP</p><h1>A small React app in one HTML file.</h1><p className="intro">This focused example loads React, ReactDOM, and Babel from CDN links, then renders a component directly from the page.</p></div>
                    <div className="status-card"><span className="status-icon">&lt;/&gt;</span><strong>CDN ready</strong><span>Open the source to see the complete component, styles, and mount point in one place.</span></div>
                </section>
                <section className="content-grid" aria-label="Project details">
                    <article className="card"><p className="eyebrow">01</p><h2>One file</h2><p>HTML, CSS, and JSX stay together for quick experiments, workshops, and simple demos.</p></article>
                    <article className="card"><p className="eyebrow">02</p><h2>React from a CDN</h2><p>The browser receives the React runtime from a public CDN instead of a local package install.</p></article>
                    <article className="card wide"><div><p className="eyebrow">THE MOUNT POINT</p><h2>See the smallest useful setup.</h2><p>A root element, one component, and one render call are enough to start.</p></div><code className="code">ReactDOM.createRoot(root)</code></article>
                </section>
            </main>
            <footer className="footer"><div className="footer-copy"><strong>Simple frontend experiments.</strong><span>Copyright &copy; {new Date().getFullYear()} <a href="https://www.ashishranjan.net/" target="_blank" rel="noopener noreferrer">Ashish Ranjan</a></span></div><div><FooterLinks links={connectLinks} /><FooterLinks links={supportLinks} /></div></footer>
        </div>;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<FirstApp />);
</script>
</body>
</html>
